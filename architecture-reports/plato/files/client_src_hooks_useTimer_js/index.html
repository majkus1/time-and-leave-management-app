    <textarea id="file-source" class="col-md-12">import { useQuery, useMutation, useQueryClient } from &#039;@tanstack/react-query&#039;
import axios from &#039;axios&#039;
import { API_URL } from &#039;../config.js&#039;
import {
	resolveActiveTimerRefetchInterval,
	resolveActiveTimerStaleTime,
} from &#039;./activeTimerQueryPolicy.js&#039;

// Get active timer status
export const useActiveTimer = ({ enabled = true } = {}) =&gt; {
	return useQuery({
		queryKey: [&#039;timer&#039;, &#039;active&#039;],
		queryFn: async () =&gt; {
			const response = await axios.get(`${API_URL}/api/workdays/timer/active`, {
				withCredentials: true,
			})
			return response.data
		},
		enabled,
		staleTime: (query) =&gt; resolveActiveTimerStaleTime(query.state.data),
		refetchInterval: (query) =&gt; resolveActiveTimerRefetchInterval(query.state.data, enabled),
		refetchIntervalInBackground: false,
		refetchOnWindowFocus: enabled,
	})
}

// Start timer
export const useStartTimer = () =&gt; {
	const queryClient = useQueryClient()

	return useMutation({
		mutationFn: async ({ workDescription, taskId, activityId, isOvertime }) =&gt; {
			const response = await axios.post(
				`${API_URL}/api/workdays/timer/start`,
				{ workDescription, taskId, activityId, isOvertime },
				{ withCredentials: true }
			)
			return response.data
		},
		onSuccess: () =&gt; {
			queryClient.invalidateQueries({ queryKey: [&#039;timer&#039;, &#039;active&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;timer&#039;, &#039;sessions&#039;] })
		},
	})
}

// Pause/Resume timer
export const usePauseTimer = () =&gt; {
	const queryClient = useQueryClient()

	return useMutation({
		mutationFn: async () =&gt; {
			const response = await axios.post(
				`${API_URL}/api/workdays/timer/pause`,
				{},
				{ withCredentials: true }
			)
			return response.data
		},
		onSuccess: () =&gt; {
			queryClient.invalidateQueries({ queryKey: [&#039;timer&#039;, &#039;active&#039;] })
		},
	})
}

// Stop timer
export const useStopTimer = () =&gt; {
	const queryClient = useQueryClient()

	return useMutation({
		mutationFn: async ({ quantity } = {}) =&gt; {
			const response = await axios.post(
				`${API_URL}/api/workdays/timer/stop`,
				{ quantity },
				{ withCredentials: true }
			)
			return response.data
		},
		onSuccess: () =&gt; {
			queryClient.invalidateQueries({ queryKey: [&#039;timer&#039;, &#039;active&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;timer&#039;, &#039;sessions&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;workdays&#039;] })
		},
	})
}

// Update active timer description
export const useUpdateActiveTimer = () =&gt; {
	const queryClient = useQueryClient()

	return useMutation({
		mutationFn: async ({ workDescription, taskId, activityId, isOvertime }) =&gt; {
			const response = await axios.put(
				`${API_URL}/api/workdays/timer/update`,
				{ workDescription, taskId, activityId, isOvertime },
				{ withCredentials: true }
			)
			return response.data
		},
		onSuccess: () =&gt; {
			queryClient.invalidateQueries({ queryKey: [&#039;timer&#039;, &#039;active&#039;] })
		},
	})
}

// Split session - save current session and continue with new description
export const useSplitSession = () =&gt; {
	const queryClient = useQueryClient()

	return useMutation({
		mutationFn: async ({ workDescription, taskId, activityId, isOvertime, quantity }) =&gt; {
			const response = await axios.post(
				`${API_URL}/api/workdays/timer/split`,
				{ workDescription, taskId, activityId, isOvertime, quantity },
				{ withCredentials: true }
			)
			return response.data
		},
		onSuccess: () =&gt; {
			queryClient.invalidateQueries({ queryKey: [&#039;timer&#039;, &#039;active&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;timer&#039;, &#039;sessions&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;workdays&#039;] })
		},
	})
}

// Get sessions for a specific month (or today if no month/year provided)
export const useTodaySessions = (month, year, { enabled: queryEnabled = true } = {}) =&gt; {
	return useQuery({
		queryKey: [&#039;timer&#039;, &#039;sessions&#039;, month, year],
		queryFn: async () =&gt; {
			const params = {}
			if (month !== undefined &amp;&amp; month !== null) {
				params.month = month
			}
			if (year !== undefined &amp;&amp; year !== null) {
				params.year = year
			}
			const response = await axios.get(`${API_URL}/api/workdays/timer/sessions`, {
				params,
				withCredentials: true,
			})
			return response.data
		},
		enabled: queryEnabled &amp;&amp; month !== undefined &amp;&amp; year !== undefined,
		staleTime: 30 * 1000, // 30 seconds
	})
}

// Delete a session
export const useDeleteSession = () =&gt; {
	const queryClient = useQueryClient()

	return useMutation({
		mutationFn: async ({ workdayId, sessionId }) =&gt; {
			const response = await axios.delete(
				`${API_URL}/api/workdays/timer/sessions/${workdayId}/${sessionId}`,
				{ withCredentials: true }
			)
			return response.data
		},
		onSuccess: () =&gt; {
			// Invalidate all related queries to ensure calendar and session list update immediately
			queryClient.invalidateQueries({ queryKey: [&#039;timer&#039;, &#039;sessions&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;workdays&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;workdays&#039;, &#039;team&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;workdays&#039;, &#039;user&#039;] })
			// Force refetch to ensure immediate update
			queryClient.refetchQueries({ queryKey: [&#039;workdays&#039;] })
		},
	})
}</textarea>
