    <textarea id="file-source" class="col-md-12">const mongoose = require(&#039;mongoose&#039;);

const scheduleEntrySchema = new mongoose.Schema({
	employeeId: {
		type: mongoose.Schema.Types.ObjectId,
		ref: &#039;User&#039;,
		required: true
	},
	employeeName: {
		type: String,
		required: true
	},
	timeFrom: {
		type: String,
		required: true,
		validate: {
			validator: function(v) {
				// Validate time format HH:mm or H:mm
				return /^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/.test(v);
			},
			message: &#039;Time format must be HH:mm (e.g., 08:00 or 8:00)&#039;
		}
	},
	timeTo: {
		type: String,
		required: true,
		validate: {
			validator: function(v) {
				return /^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/.test(v);
			},
			message: &#039;Time format must be HH:mm (e.g., 16:00 or 8:00)&#039;
		}
	},
	createdBy: {
		type: mongoose.Schema.Types.ObjectId,
		ref: &#039;User&#039;,
		required: true
	},
	notes: {
		type: String,
	}
	,
	isPublished: {
		type: Boolean,
		default: true
	},
	autoGenerated: {
		type: Boolean,
		default: false
	}
}, { _id: true, timestamps: true });

const scheduleDaySchema = new mongoose.Schema({
	date: {
		type: Date,
		required: true
	},
	availabilities: [{
		employeeId: {
			type: mongoose.Schema.Types.ObjectId,
			ref: &#039;User&#039;,
			required: true
		},
		employeeName: {
			type: String,
			required: true
		},
		notes: {
			type: String,
			default: &#039;&#039;
		},
		timeWindows: [{
			timeFrom: {
				type: String,
				validate: {
					validator: function(v) {
						return !v || /^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/.test(v);
					},
					message: &#039;Time format must be HH:mm (e.g., 08:00)&#039;
				}
			},
			timeTo: {
				type: String,
				validate: {
					validator: function(v) {
						return !v || /^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/.test(v);
					},
					message: &#039;Time format must be HH:mm (e.g., 16:00)&#039;
				}
			}
		}],
		declaredAt: {
			type: Date,
			default: Date.now
		},
		updatedAt: {
			type: Date,
			default: Date.now
		}
	}],
	entries: [scheduleEntrySchema]
}, { _id: false });

const scheduleSchema = new mongoose.Schema({
	name: {
		type: String,
		required: true,
		trim: true
	},
	teamId: {
		type: mongoose.Schema.Types.ObjectId,
		ref: &#039;Team&#039;,
		required: true
	},
	type: {
		type: String,
		enum: [&#039;team&#039;, &#039;department&#039;, &#039;custom&#039;],
		required: true
	},
	availabilityEnabled: {
		type: Boolean,
		default: false
	},
	departmentName: {
		type: String,
		required: function() {
			return this.type === &#039;department&#039;;
		}
	},
	members: [{
		type: mongoose.Schema.Types.ObjectId,
		ref: &#039;User&#039;
	}],
	createdBy: {
		type: mongoose.Schema.Types.ObjectId,
		ref: &#039;User&#039;
	},
	days: [scheduleDaySchema],
	autoPlanConfig: {
		minEmployeesPerDay: {
			type: Number,
			default: 1,
			min: 1
		},
		defaultShiftDurationHours: {
			type: Number,
			default: 8,
			min: 1,
			max: 24
		}
	},
	isActive: {
		type: Boolean,
		default: true
	}
}, {
	collection: &#039;schedules&#039;,
	timestamps: true
});

// Indexes for efficient queries
scheduleSchema.index({ teamId: 1, type: 1 });
scheduleSchema.index({ teamId: 1, departmentName: 1 });
scheduleSchema.index({ teamId: 1, name: 1 });
scheduleSchema.index({ members: 1 });

module.exports = conn =&gt; (conn.models.Schedule || conn.model(&#039;Schedule&#039;, scheduleSchema));</textarea>
