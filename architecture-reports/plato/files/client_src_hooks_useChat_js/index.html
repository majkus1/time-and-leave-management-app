    <textarea id="file-source" class="col-md-12">import { useQuery, useMutation, useQueryClient } from &#039;@tanstack/react-query&#039;
import axios from &#039;axios&#039;
import { API_URL } from &#039;../config.js&#039;

// Get user channels
export const useChannels = () =&gt; {
	return useQuery({
		queryKey: [&#039;channels&#039;],
		queryFn: async () =&gt; {
			const response = await axios.get(`${API_URL}/api/chat/channels`, {
				withCredentials: true
			})
			return response.data
		},
		staleTime: 30 * 1000, // 30 seconds
		refetchInterval: 60 * 1000 // Refetch every minute
	})
}

// Get messages for a channel
export const useChannelMessages = (channelId, enabled = true) =&gt; {
	return useQuery({
		queryKey: [&#039;messages&#039;, channelId],
		queryFn: async () =&gt; {
			const response = await axios.get(`${API_URL}/api/chat/channels/${channelId}/messages`, {
				withCredentials: true
			})
			return response.data
		},
		enabled: enabled &amp;&amp; !!channelId,
		staleTime: 10 * 1000, // 10 seconds
		refetchInterval: 30 * 1000 // Refetch every 30 seconds
	})
}

// Get channel users
export const useChannelUsers = (channelId, enabled = true) =&gt; {
	return useQuery({
		queryKey: [&#039;channelUsers&#039;, channelId],
		queryFn: async () =&gt; {
			const response = await axios.get(`${API_URL}/api/chat/channels/${channelId}/users`, {
				withCredentials: true
			})
			return response.data
		},
		enabled: enabled &amp;&amp; !!channelId,
		staleTime: 5 * 1000, // 5 seconds - users can change frequently
		refetchInterval: 30 * 1000 // Refetch every 30 seconds for real-time updates
	})
}

// Send message mutation
export const useSendMessage = () =&gt; {
	const queryClient = useQueryClient()
	
	return useMutation({
		mutationFn: async ({ channelId, content, attachments = [] }) =&gt; {
			const hasAttachments = Array.isArray(attachments) &amp;&amp; attachments.length &gt; 0
			let response

			if (hasAttachments) {
				const formData = new FormData()
				formData.append(&#039;channelId&#039;, channelId)
				formData.append(&#039;content&#039;, content || &#039;&#039;)
				attachments.forEach((file) =&gt; {
					formData.append(&#039;attachments&#039;, file)
				})
				response = await axios.post(`${API_URL}/api/chat/messages`, formData, {
					withCredentials: true,
					headers: {
						&#039;Content-Type&#039;: &#039;multipart/form-data&#039;
					}
				})
			} else {
				response = await axios.post(
					`${API_URL}/api/chat/messages`,
					{ channelId, content },
					{ withCredentials: true }
				)
			}

			return response.data
		},
		onSuccess: (data, variables) =&gt; {
			// Invalidate messages query to refetch
			queryClient.invalidateQueries({ queryKey: [&#039;messages&#039;, variables.channelId] })
			// Also invalidate channels to update unread counts
			queryClient.invalidateQueries({ queryKey: [&#039;channels&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;unreadCount&#039;] })
		}
	})
}

// Update own message
export const useUpdateMessage = () =&gt; {
	const queryClient = useQueryClient()

	return useMutation({
		mutationFn: async ({ messageId, content, channelId }) =&gt; {
			const response = await axios.put(
				`${API_URL}/api/chat/messages/${messageId}`,
				{ content },
				{ withCredentials: true }
			)
			return { ...response.data, channelId }
		},
		onSuccess: (_, variables) =&gt; {
			queryClient.invalidateQueries({ queryKey: [&#039;messages&#039;, variables.channelId] })
			queryClient.invalidateQueries({ queryKey: [&#039;channels&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;unreadCount&#039;] })
		}
	})
}

// Delete own message
export const useDeleteMessage = () =&gt; {
	const queryClient = useQueryClient()

	return useMutation({
		mutationFn: async ({ messageId, channelId }) =&gt; {
			const response = await axios.delete(`${API_URL}/api/chat/messages/${messageId}`, {
				withCredentials: true
			})
			return { ...response.data, channelId }
		},
		onSuccess: (_, variables) =&gt; {
			queryClient.invalidateQueries({ queryKey: [&#039;messages&#039;, variables.channelId] })
			queryClient.invalidateQueries({ queryKey: [&#039;channels&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;unreadCount&#039;] })
		}
	})
}

// Get unread count
export const useUnreadCount = ({ enabled = true } = {}) =&gt; {
	return useQuery({
		queryKey: [&#039;unreadCount&#039;],
		queryFn: async () =&gt; {
			const response = await axios.get(`${API_URL}/api/chat/unread-count`, {
				withCredentials: true
			})
			return response.data.unreadCount || 0
		},
		enabled,
		staleTime: 10 * 1000, // 10 seconds
		refetchInterval: enabled ? 30 * 1000 : false,
	})
}

// Get team members
export const useTeamMembers = () =&gt; {
	return useQuery({
		queryKey: [&#039;teamMembers&#039;],
		queryFn: async () =&gt; {
			const response = await axios.get(`${API_URL}/api/chat/team-members`, {
				withCredentials: true
			})
			return response.data
		},
		staleTime: 5 * 60 * 1000, // 5 minutes
		cacheTime: 10 * 60 * 1000
	})
}

// Create channel mutation
export const useCreateChannel = () =&gt; {
	const queryClient = useQueryClient()
	return useMutation({
		mutationFn: async ({ name, type, description, memberIds }) =&gt; {
			const response = await axios.post(
				`${API_URL}/api/chat/channels`,
				{ name, type, description, memberIds },
				{ withCredentials: true }
			)
			return response.data
		},
		onSuccess: () =&gt; {
			// Invalidate and refetch channels immediately
			queryClient.invalidateQueries({ queryKey: [&#039;channels&#039;] })
			queryClient.refetchQueries({ queryKey: [&#039;channels&#039;] })
		}
	})
}

// Add members to channel mutation
export const useAddMembersToChannel = () =&gt; {
	const queryClient = useQueryClient()
	return useMutation({
		mutationFn: async ({ channelId, memberIds }) =&gt; {
			const response = await axios.post(
				`${API_URL}/api/chat/channels/${channelId}/members`,
				{ memberIds },
				{ withCredentials: true }
			)
			return response.data
		},
		onSuccess: () =&gt; {
			queryClient.invalidateQueries({ queryKey: [&#039;channels&#039;] })
		}
	})
}

// Create private chat mutation
export const useCreatePrivateChat = () =&gt; {
	const queryClient = useQueryClient()
	return useMutation({
		mutationFn: async ({ userId }) =&gt; {
			const response = await axios.post(
				`${API_URL}/api/chat/private-chat`,
				{ userId },
				{ withCredentials: true }
			)
			return response.data
		},
		onSuccess: () =&gt; {
			queryClient.invalidateQueries({ queryKey: [&#039;channels&#039;] })
		}
	})
}

// Remove members from channel mutation
export const useRemoveMembersFromChannel = () =&gt; {
	const queryClient = useQueryClient()
	return useMutation({
		mutationFn: async ({ channelId, memberIds }) =&gt; {
			const response = await axios.delete(
				`${API_URL}/api/chat/channels/${channelId}/members`,
				{ 
					data: { memberIds },
					withCredentials: true 
				}
			)
			return response.data
		},
		onSuccess: () =&gt; {
			queryClient.invalidateQueries({ queryKey: [&#039;channels&#039;] })
		}
	})
}

// Delete channel mutation
export const useDeleteChannel = () =&gt; {
	const queryClient = useQueryClient()
	return useMutation({
		mutationFn: async ({ channelId }) =&gt; {
			const response = await axios.delete(
				`${API_URL}/api/chat/channels/${channelId}`,
				{ withCredentials: true }
			)
			return response.data
		},
		onSuccess: () =&gt; {
			queryClient.invalidateQueries({ queryKey: [&#039;channels&#039;] })
			queryClient.invalidateQueries({ queryKey: [&#039;unreadCount&#039;] })
		}
	})
}</textarea>
