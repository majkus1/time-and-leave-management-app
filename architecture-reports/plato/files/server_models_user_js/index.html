<div class="container">
  <div class="row">
    <textarea id="file-source" class="col-md-12">const mongoose = require(&#039;mongoose&#039;);
const bcrypt = require(&#039;bcryptjs&#039;);

const userSchema = new mongoose.Schema({
    username: { type: String, required: true },
    password: { type: String, required: false },
    firstName: { type: String, required: true },
    lastName: { type: String, required: true },
    teamId: { 
        type: mongoose.Schema.Types.ObjectId, 
        ref: &#039;Team&#039;, 
        required: true 
    },
    roles: {
        type: [String],
        enum: [
            &#039;Admin&#039;,                             
            &#039;Pracownik (Worker)&#039;,                         
            &#039;Przełożony (Supervisor)&#039;,
            &#039;HR&#039;
        ],
        required: true
    },
    department: { type: [String], default: [] }, // Tablica działów - użytkownik może być w wielu działach
    supervisors: [{ 
        type: mongoose.Schema.Types.ObjectId, 
        ref: &#039;User&#039; 
    }], // Kto jest przełożonym tego użytkownika
    position: { type: String, required: false },
    leaveDays: { type: Number, default: 0 },
    vacationDays: { type: Number, default: 0 }, // DEPRECATED - zostawiamy dla kompatybilności wstecznej, ale nowe dane w leaveTypeDays
    leaveTypeDays: { type: mongoose.Schema.Types.Mixed, default: {} }, // Object: { &#039;leaveform.option1&#039;: 26, &#039;custom-xxx&#039;: 10, ... }
    isTeamAdmin: { type: Boolean, default: false },
    appAccessEnabled: {
        type: Boolean,
        default: true,
        index: true
    },
    managedOnly: {
        type: Boolean,
        default: false,
        index: true
    },
    createdBy: {
        type: mongoose.Schema.Types.ObjectId,
        ref: &#039;User&#039;,
        required: false
    },
    isActive: {
        type: Boolean,
        default: true,
        index: true
    },
    deletedAt: {
        type: Date,
        default: null
    },
    hasSeenTutorial: {
        type: Boolean,
        default: false
    },
    firstLoginAt: {
        type: Date,
        default: null
    },
    announcementsLastSeenAt: {
        type: Date,
        default: null
    }
}, { collection: &#039;users&#039; });

// Partial unique index - wymusza unikalność username tylko dla aktywnych użytkowników
// Soft-deleted użytkownicy (isActive: false) nie blokują rejestracji z tym samym username
userSchema.index(
    { username: 1 },
    { 
        unique: true,
        partialFilterExpression: { isActive: { $ne: false } }
    }
);

userSchema.pre(&#039;save&#039;, async function (next) {
    if (this.isModified(&#039;password&#039;) &amp;&amp; this.password &amp;&amp; !this.password.startsWith(&#039;$2a$12$&#039;)) {
        this.password = await bcrypt.hash(this.password, 12);
    }
    next();
});

module.exports = conn =&gt; (conn.models.User || conn.model(&#039;User&#039;, userSchema));</textarea>
