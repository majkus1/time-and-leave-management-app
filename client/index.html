<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="description" content="Planopia - aplikacja do zarządzania czasem pracy, urlopami i zespołem" />
  <meta name="keywords" content="zarządzanie zespołem, urlopy, czas pracy, planowanie" />
  <meta name="author" content="Planopia" />
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0d6efd" id="meta-theme-color" />
  <script>
    (function () {
      try {
        // THEME_SWITCHER_ENABLED=false — zawsze jasny do czasu wdrożenia dark mode
        var theme = 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', '#0d6efd');
      } catch (e) {}
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Planopia" />
  
  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  
  <!-- DNS Prefetch for better performance -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
