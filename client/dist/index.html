  <meta name="author" content="Planopia" />
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0d6efd" id="meta-theme-color" />
  <script>
    (function () {
      try {
        var key = 'planopia-theme';
        var pref = localStorage.getItem(key);
        var theme = pref === 'dark' ? 'dark' : 'light';
        var dark = theme === 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', dark ? '#0f1419' : '#0d6efd');
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('i18nextLng') || '';
        var lang = stored.toLowerCase().indexOf('en') === 0 ? 'en' : 'pl';
        document.documentElement.lang = lang;
        document.documentElement.setAttribute('translate', 'no');
        document.documentElement.classList.add('notranslate');
      } catch (e) {}
    })();
  </script>
